name: inkwell-store

services:

  front-end-client:
    networks:
      - inkwell
      
  api-gateway:
    ports:
      - "8080:8080"
    networks:
      - inkwell

  authorization-service:
    networks:
      - inkwell

  customer-service:
    networks:
      - inkwell

  rabbitmq-service:
    image: rabbitmq:4.3.6-management
    ports:
      - "5672:5672"
      - "15672:15672"

    # Setup the topology's definitions from the infrastructure folder
    volumes:
      - type: bind
        source: ./rabbitmq/rabbitmq.conf
        target: /etc/rabbitmq/rabbitmq.conf
        read_only: true
      
      - type: bind
        source: ./rabbitmq/definitions.json
        target: /etc/rabbitmq/definitions.json
        read_only: true
    
    networks:
      - inkwell

  notification-service:
    networks:
      - inkwell

networks:
  inkwell: {}
